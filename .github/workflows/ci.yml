name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test, Typecheck, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run journey engine tests
        run: npm test

      - name: Typecheck journey engine
        run: npm run typecheck --workspace @dreamer/journey-engine

      - name: Typecheck web app
        run: npm run typecheck --workspace @dreamer/web

      - name: Lint web app
        run: npm run lint --workspace @dreamer/web

      - name: Build web app
        run: npm run build --workspace @dreamer/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
